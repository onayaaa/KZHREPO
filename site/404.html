<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜葛葉 データアーカイブ</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0a0a0a;
    color: #f2f2f2;
    font-family: "Geist", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 480px; }
  .code {
    margin: 0 0 24px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #a8a8a8;
  }
  h1 { margin: 0 0 32px; font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
  p { margin: 0; color: #a8a8a8; font-size: 14px; }
  .actions { margin-top: 40px; display: flex; gap: 24px; align-items: center; }
  a { color: #f2f2f2; font-size: 14px; font-weight: 500; text-decoration: none; border-bottom: 1px solid #f2f2f2; padding-bottom: 2px; }
  a:hover { color: #e5484d; border-bottom-color: #e5484d; }
  a:focus-visible { outline: 2px solid #e5484d; outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>ページが見つかりません</h1>
  <p>URL が変わったか、ページが削除された可能性があります。</p>
  <div class="actions">
    <a href="./">トップへ戻る</a>
  </div>
</main>
</body>
</html>
