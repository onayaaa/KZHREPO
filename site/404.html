<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜葛葉 データアーカイブ</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #1a0d11 0%, #08070A 55%, #050406 100%);
    color: #f3eef0; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    padding: 32px;
  }
  main { max-width: 560px; text-align: center; }
  .code { margin: 0; font-size: 88px; font-weight: 900; line-height: 1; letter-spacing: .04em;
          background: linear-gradient(135deg, #fb7185, #e11d48 52%, #7a1229);
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { margin: 18px 0 10px; font-size: 20px; letter-spacing: .04em; }
  p { margin: 0 0 14px; color: #b5a9ae; font-size: 13.5px; line-height: 1.9; }
  .hint { margin-top: 22px; font-size: 12px; color: #8a7f85; }
  a {
    display: inline-block; margin-top: 10px; padding: 10px 18px; border-radius: 10px;
    color: #fff; text-decoration: none; font-weight: 700; font-size: 13.5px;
    background: linear-gradient(135deg, #fb7185, #e11d48 48%, #7a1229);
    box-shadow: 0 8px 24px rgba(225, 29, 72, .28);
  }
  a:focus-visible { outline: 2px solid #ff8fa0; outline-offset: 3px; }
  hr { border: 0; border-top: 1px solid rgba(225, 29, 72, .3); margin: 24px auto; max-width: 120px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>ページが見つかりません</h1>
  <p>URL が変わったか、ページが削除された可能性があります。</p>
  <hr>
  <a href="./">トップへ戻る</a>
  <p class="hint">
    このサイトは <code>#/streams?y=2024</code> のようなハッシュで画面を切り替えます。<br>
    ブックマークが開けないときは、トップから同じ条件を選び直してください。
  </p>
</main>
</body>
</html>
